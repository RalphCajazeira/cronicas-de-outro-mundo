name: Pull request CI

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate pull request
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/game_gpt_dev
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/game_gpt_dev
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/game_gpt_test
      TEST_DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/game_gpt_test
      TEST_RPG_API_KEY: ci-test-key
    steps:
      - name: Check out the pull request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            widget/package-lock.json

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --prefix backend --include=dev
          npm ci --prefix widget --include=dev

      - name: Run the canonical validation suite
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:validate
